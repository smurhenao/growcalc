<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Calculadora de dosificación Soul Sensei para fertirriego">

    <title>Soul Sensei Calculator</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="./css/styles.css">

</head>

<body>

    <main class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="logo">
                🌱
            </div>

            <h1 class="app-title">
                Soul Sensei
            </h1>

            <p class="app-subtitle">
                Nutrient Calculator
            </p>

        </header>

        <!-- STAGE -->

        <section class="card">

            <h2 class="section-title">
                Etapa del cultivo
            </h2>

            <div class="stage-selector">

                <button
                    class="stage-btn active"
                    data-stage="vegetative">

                    🌿
                    <span>Vegetativo</span>

                </button>

                <button
                    class="stage-btn"
                    data-stage="flowering">

                    🌸
                    <span>Floración</span>

                </button>

            </div>

        </section>

        <!-- WEEKS -->

        <section class="card">

            <h2 class="section-title">
                Semana
            </h2>

            <div
                id="weeksContainer"
                class="weeks-container">

                <!-- Generado dinámicamente -->

            </div>

        </section>

        <!-- WATER -->

        <section class="card">

            <h2 class="section-title">
                Cantidad de agua
            </h2>

            <div class="water-wrapper">

                <input
                    id="waterInput"
                    class="water-input"
                    type="number"
                    min="0"
                    step="0.01"
                    placeholder="10">

                <span class="water-unit">
                    Litros
                </span>

            </div>

        </section>

        <!-- RESULTS -->

        <section class="card">

            <h2 class="section-title">
                Dosificación
            </h2>

            <div
                id="nutrientsContainer"
                class="nutrients-container">

                <!-- Generado dinámicamente -->

            </div>

        </section>

        <!-- MIXING ORDER -->

        <section class="card">

            <h2 class="section-title">
                Orden de mezcla
            </h2>

            <ol class="mixing-order">

                <li>Grow</li>

                <li>Micro</li>

                <li>Bloom</li>

                <li>Ajustar pH</li>

            </ol>

        </section>

        <!-- FOOTER -->

        <footer class="footer">

            <p>
                Powered by
                <strong>EKE Software</strong>
            </p>

        </footer>

    </main>

    <!-- APP -->

    <script
        type="module"
        src="./js/app.js">
    </script>

</body>

</html>
